name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev cython3 ccache openjdk-17-jdk
          pip install --upgrade "buildozer<3.0.0" "cython<3.0.0"

      - name: Build with Buildozer
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          export BUILDOZER_ACCEPT_SDK_LICENSE=1
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Super-Zoom-X300-Pro-APK
          path: bin/*.apk
          
